name: Publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Publish package
        run: npx jsr publish
